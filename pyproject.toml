[project]
name = "langgraph-agent"
version = "0.2.0"
description = "Multi-Agent System based on LangGraph with intent routing"
authors = [
    {name = "qifuxiao", email = "867225266@qq.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # LangChain & LangGraph (latest versions)
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    
    # FastAPI & Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.2.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    
    # Data & Analysis
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "plotly>=6.0.0",
    
    # Web Search
    "brave-search>=1.0.0",
    "tavily>=1.0.0",
    
    # File Processing
    "python-magic>=0.4.27",
    "aiofiles>=24.0.0",
    
    # Embeddings
    "langchain-huggingface>=0.1.0",
    
    # Utils
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
]

[project.urls]
Homepage = "https://github.com/qifuxiao/langgraph-agent"
Repository = "https://github.com/qifuxiao/langgraph-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
